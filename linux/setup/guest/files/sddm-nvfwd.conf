# The GPU step decides whether this boot's desktop goes on the GPU, so the login screen waits for it.
# Wants and not Requires: with the GPU step dead the login screen still comes up, plain. SDDM starts
# KWin for its login screen itself, so it reads the boot's settings here; Plasma's own session gets them
# from systemd's user manager, as GNOME does.
[Unit]
After=nvfwd-gpu.service
Wants=nvfwd-gpu.service

[Service]
EnvironmentFile=-/run/environment.d/90-nvfwd.conf
