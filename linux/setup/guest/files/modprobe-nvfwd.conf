# gpu-up.sh loads these itself, once it has checked them. Without this, udev would load whatever
# nvidia.ko is on disk as soon as it sees the device, perhaps one built for an older driver.
blacklist nvidia
# No vblank, framebuffer console or colour pipeline: the stand-in has none of them.
options nvidia-drm modeset=1 fbdev=0 vblank=0 color_pipeline=0
