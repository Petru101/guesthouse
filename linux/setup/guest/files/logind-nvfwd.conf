# The app's Shut Down presses the VM's power button. logind powers off for it when no desktop has taken
# the button, and doesn't wait on programs that only hold back a shutdown. GNOME's settings daemon,
# which does take the button, powers off at once in a VM; Plasma's is told to in /etc/xdg/powerdevilrc.
[Login]
HandlePowerKey=poweroff
PowerKeyIgnoreInhibited=yes
