[package]
name = "guesthouse-app"
description = "The desktop app: a library of machines, their settings, first-run setup and the viewer's shell."
version.workspace = true
edition.workspace = true
# GTK's Rust bindings need this.
rust-version = "1.92"
publish.workspace = true
license.workspace = true

[[bin]]
name = "guesthouse"
path = "src/main.rs"

[features]
default = ["hdr"]
# HDR needs GTK 4.16 for a frame's colour. A build without it runs on GTK 4.14 and shows SDR only.
hdr = ["gtk/v4_16"]

[dependencies]
guesthouse-app-core.workspace = true
# The UI. These are the oldest that do: what Ubuntu 24.04 has.
adw = { package = "libadwaita", version = "0.9", features = ["v1_5"] }
gtk = { package = "gtk4", version = "0.11", features = ["v4_14"] }
# Progress from a thread to GTK's main loop, which glib no longer has a channel for.
async-channel = "2"
# Local time for snapshot dates.
chrono = { version = "0.4", default-features = false, features = ["clock"] }
# The slot type that names a VM.
guesthouse-daemon.workspace = true
# Locking the pointer, and asking whether a monitor is in HDR: GTK has no API for the Wayland
# protocols these take, so they're used directly, on GTK's own connection.
gdk-wayland = { package = "gdk4-wayland", version = "0.11", features = ["wayland_crate"] }
wayland-client = "0.31"
wayland-protocols = { version = "0.32", features = ["client", "staging", "unstable"] }
# How frames arrive.
guesthouse-frame-socket.workspace = true
# Reading a shared buffer and passing QEMU a socket, without `unsafe`.
rustix = { version = "1", features = ["fs", "net"] }
# What the app remembers is a small JSON file.
serde_json = "1"

[[example]]
name = "page_shots"
path = "examples/page_shots/main.rs"

[lints]
workspace = true
